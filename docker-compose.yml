version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: neurolab_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neurolab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurolab_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-neurolab_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neurolab} -d ${POSTGRES_DB:-neurolab_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: neurolab_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: neurolab_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: ./services/api
      dockerfile: ../../infra/docker/Dockerfile.api
    container_name: neurolab_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app

  worker:
    build:
      context: ./workers/training
      dockerfile: ../../infra/docker/Dockerfile.worker
    container_name: neurolab_worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    env_file:
      - .env
    volumes:
      - ./workers/training:/app
      - model_artifacts:/artifacts

  web:
    build:
      context: ./apps/web
      dockerfile: ../../infra/docker/Dockerfile.web
    container_name: neurolab_web
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  miniodata:
  model_artifacts:
